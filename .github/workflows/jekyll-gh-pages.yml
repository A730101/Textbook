# 部署靜態網頁到 GitHub Pages
name: Deploy Static Site to GitHub Pages

on:
  # 當推送到指定分支時觸發
  push:
    branches: ["claude/prompt-notebook-manager-011CUyKNGdCBgxh3q2pogiTd"]

  # 允許從 Actions 標籤手動運行
  workflow_dispatch:

# 設置 GITHUB_TOKEN 的權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允許一個並發部署，跳過正在運行和最新排隊之間的運行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 部署作業
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳整個專案目錄
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
